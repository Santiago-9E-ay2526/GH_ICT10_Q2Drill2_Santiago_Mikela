<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- PYSCRIPT CDN -->
      <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
      <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
      <!-- BOOTSTRAP CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
      <!-- WHIMSICAL GOOGLE FONTS -->
      <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
      <title>Book Club Members</title>

      <style>
            @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
            }

            @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
            }

            body {
            background: radial-gradient(circle at 20% 20%, #4a154b 0%, #1e1035 40%, #0d1b2a 100%);
            color: #f3e5f5;
            font-family: 'Fredoka', cursive, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem 1.5rem;
            box-sizing: border-box;
            overflow-x: hidden;
            }

            /* Sparkle backdrop effect */
            body::before {
            content: "✨ ✦ 🌸 🔮 ✦ 🍃 ✨ 🌙 ✦ ✨";
            position: absolute;
            top: 5%;
            font-size: 1.5rem;
            letter-spacing: 40px;
            opacity: 0.3;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
            }

            h3 {
            font-family: 'Cinzel Decorative', cursive, serif;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #d4fc79, #96e6a1);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 5s ease infinite, float 4s ease-in-out infinite;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            padding: 0 20px;
            max-width: 100%;
            box-sizing: border-box;
            filter: drop-shadow(0 0 12px rgba(236, 178, 255, 0.6));
            }

            form {
            background: rgba(38, 18, 62, 0.65);
            border: 3px solid #f48fb1;
            border-image: linear-gradient(to bottom right, #f48fb1, #80deea, #a5d6a7) 1;
            box-shadow: 0 0 30px rgba(244, 143, 177, 0.3), 0 0 60px rgba(128, 222, 234, 0.2);
            padding: 3rem 2.5rem;
            border-radius: 30px !important;
            backdrop-filter: blur(12px);
            max-width: 420px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            }

            /* Whimsical corner accents */
            form::before {
            content: "✨";
            position: absolute;
            top: -15px;
            left: -15px;
            font-size: 1.8rem;
            }

            form::after {
            content: "🍃";
            position: absolute;
            bottom: -15px;
            right: -15px;
            font-size: 1.8rem;
            }

            input[type="text"] {
            background: rgba(20, 10, 35, 0.85) !important;
            border: 2px dashed #b388ff !important;
            color: #e0f7fa !important;
            border-radius: 20px !important;
            padding: 0.85rem 1.2rem !important;
            margin-bottom: 1.2rem !important;
            width: 100% !important;
            text-align: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            }

            input[type="text"]::placeholder {
            color: #b0bec5;
            font-style: italic;
            }

            input[type="text"]:focus {
            border-style: solid !important;
            border-color: #80e27e !important;
            box-shadow: 0 0 15px rgba(128, 226, 126, 0.6), 0 0 25px rgba(179, 136, 255, 0.5) !important;
            transform: scale(1.03);
            outline: none;
            }

            input[type="button"] {
            background: linear-gradient(135deg, #ab47bc, #42a5f5, #66bb6a) !important;
            background-size: 200% 200% !important;
            border: none !important;
            color: #ffffff !important;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 25px !important;
            padding: 0.8rem 2.5rem !important;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 6px 20px rgba(171, 71, 188, 0.4);
            width: 100%;
            margin-top: 0.5rem;
            }

            input[type="button"]:hover {
            background-position: right center !important;
            box-shadow: 0 8px 25px rgba(102, 187, 106, 0.6), 0 0 15px rgba(255, 255, 255, 0.8);
            transform: translateY(-4px) scale(1.02);
            }

            #result {
            margin-top: 2rem;
            padding: 0 20px;
            max-width: 500px;
            width: 100%;
            font-size: 1.25rem;
            font-weight: 600;
            color: #a7ffeb;
            text-shadow: 0 0 12px rgba(167, 255, 235, 0.6);
            text-align: center;
            font-family: 'Fredoka', sans-serif;
            white-space: pre-line;
            overflow-wrap: anywhere;
            animation: float 3s ease-in-out infinite;
            }
      </style>

</head>
<body>

      <h3>Add new book club member:</h3>

      <form>
            <input type="text" id="firstname" placeholder="Enter your first name"><br>
            <input type="text" id="lastname" placeholder="Enter your last name"><br>
            <input type="button" py-click="submit_name" value="Submit">
      </form>

      <!-- Member list -->
      <div id="result" style="white-space: pre-line;"></div>

      <!-- PYSCRIPT -->
      <py-script src="main.py"></py-script>

</body>
</html>
